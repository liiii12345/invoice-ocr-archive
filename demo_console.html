<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文档档案库 · Contract Archive</title>
<style>
  :root{
    --bg:#f7f8fa; --panel:#ffffff; --ink:#1f2329; --ink-2:#646a73; --ink-3:#8f959e;
    --line:#e5e6eb; --line-2:#eceef1; --hover:#f2f3f5; --sel:#eef3ff;
    --accent:#2f6feb; --accent-weak:#eef3ff; --ok:#1a8a4a; --warn:#c8730a; --bad:#d83931;
    --mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Roboto,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased}
  /* ── top bar ── */
  .topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 18px;gap:14px;position:sticky;top:0;z-index:30}
  .brand{display:flex;align-items:center;gap:9px;font-weight:600;font-size:14px;letter-spacing:.2px}
  .brand .mark{width:22px;height:22px;border-radius:5px;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#fff;font-size:12px;font-weight:700}
  .brand .ver{font-size:11px;color:var(--ink-3);font-weight:500;border:1px solid var(--line);border-radius:4px;padding:1px 6px;margin-left:2px}
  .search{flex:1;max-width:440px;position:relative}
  .search input{width:100%;height:34px;border:1px solid var(--line);border-radius:7px;background:#fafbfc;padding:0 12px 0 32px;font-size:13px;color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent);background:#fff}
  .search svg{position:absolute;left:10px;top:9px;width:15px;height:15px;color:var(--ink-3)}
  .spacer{flex:1}
  .envtag{font-size:11px;color:var(--ink-2);background:var(--hover);border:1px solid var(--line-2);border-radius:5px;padding:4px 9px;font-family:var(--mono)}
  .btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);height:32px;padding:0 13px;border-radius:7px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;font-family:var(--sans)}
  .btn:hover{background:var(--hover)}
  .btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .btn.primary:hover{background:#2a62d4}
  /* ── shell ── */
  .shell{display:flex;height:calc(100vh - 52px)}
  /* ── sidebar ── */
  .side{width:312px;min-width:312px;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column}
  .side-h{padding:14px 16px 10px;display:flex;align-items:center;justify-content:space-between}
  .side-h .t{font-weight:600;font-size:13px}
  .side-h .c{font-size:11px;color:var(--ink-3);background:var(--hover);border-radius:10px;padding:1px 8px}
  .filters{padding:0 16px 12px;border-bottom:1px solid var(--line-2);display:flex;flex-direction:column;gap:8px}
  .filters .row{display:flex;gap:8px}
  .filters select,.filters input{height:30px;border:1px solid var(--line);border-radius:6px;background:#fafbfc;padding:0 8px;font-size:12px;color:var(--ink);outline:none;font-family:var(--sans)}
  .filters select:focus,.filters input:focus{border-color:var(--accent)}
  .filters .am{flex:1;min-width:0}
  .filters .lbl{font-size:11px;color:var(--ink-3);margin-bottom:2px}
  .list{flex:1;overflow:auto}
  .item{padding:11px 16px;border-bottom:1px solid var(--line-2);cursor:pointer;border-left:2px solid transparent;display:flex;flex-direction:column;gap:4px}
  .item:hover{background:var(--hover)}
  .item.active{background:var(--sel);border-left-color:var(--accent)}
  .item .top{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .item .ttl{font-size:13px;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .item .amt{font-size:12px;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .item .sub{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .item .ty{font-size:11px;color:var(--ink-3)}
  .conf{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--ink-3)}
  .conf .bar{width:42px;height:3px;background:var(--line);border-radius:2px;overflow:hidden}
  .conf .bar i{display:block;height:100%;background:var(--accent)}
  .empty{padding:40px 20px;text-align:center;color:var(--ink-3);font-size:12.5px}
  /* ── main ── */
  .main{flex:1;overflow:auto;background:var(--bg)}
  .doc-h{padding:20px 28px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
  .doc-h h1{font-size:18px;font-weight:600;letter-spacing:.2px}
  .doc-h .meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2)}
  .doc-h .meta span{display:inline-flex;align-items:center;gap:5px}
  .doc-h .meta b{color:var(--ink-3);font-weight:500}
  .tabs{display:flex;gap:2px;padding:0 24px;background:var(--panel);border-bottom:1px solid var(--line)}
  .tab{padding:11px 14px;font-size:13px;color:var(--ink-2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
  .tab:hover{color:var(--ink)}
  .tab.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:500}
  .pane{padding:22px 28px 48px;max-width:1080px}
  .pane.hidden{display:none}
  /* overview */
  .summary{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;color:var(--ink-2);line-height:1.7;font-size:13px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-top:16px}
  .cell{background:var(--panel);padding:13px 15px}
  .cell .k{font-size:11px;color:var(--ink-3);margin-bottom:4px;letter-spacing:.3px}
  .cell .v{font-size:13.5px;color:var(--ink);font-weight:500;word-break:break-word}
  .cell .v.mono{font-family:var(--mono);font-size:12px;font-weight:400}
  /* fields */
  .sec{margin-bottom:22px}
  .sec-h{font-size:12px;font-weight:600;color:var(--ink-2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:10px;display:flex;align-items:center;gap:8px}
  .sec-h::after{content:"";flex:1;height:1px;background:var(--line-2)}
  table.kv{width:100%;border-collapse:collapse;background:var(--panel);border:1px solid var(--line);border-radius:9px;overflow:hidden}
  table.kv th,table.kv td{text-align:left;padding:10px 14px;font-size:12.5px;border-bottom:1px solid var(--line-2);vertical-align:top}
  table.kv th{width:170px;color:var(--ink-3);font-weight:500;background:#fafbfc}
  table.kv tr:last-child td,table.kv tr:last-child th{border-bottom:none}
  .muted{color:var(--ink-3)}
  .pill{display:inline-block;font-size:11px;padding:1px 8px;border-radius:11px;background:var(--hover);color:var(--ink-2);border:1px solid var(--line-2)}
  .pill.ok{background:#eaf6ef;color:var(--ok);border-color:#d3ecdd}
  .pill.warn{background:#fdf3e7;color:var(--warn);border-color:#f6e3c8}
  .pill.bad{background:#fdeceb;color:var(--bad);border-color:#f7d6d4}
  /* ocr / code */
  pre.code{background:#1f2329;color:#e6e8eb;font-family:var(--mono);font-size:12px;line-height:1.65;padding:16px 18px;border-radius:9px;overflow:auto;white-space:pre-wrap;word-break:break-word;max-height:62vh}
  pre.code .cm{color:#7c8493}
  .prose{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:16px 18px;font-family:var(--mono);font-size:12px;line-height:1.7;color:var(--ink);white-space:pre-wrap;word-break:break-word;max-height:62vh;overflow:auto}
  /* preview */
  .prev-wrap{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:14px;display:flex;justify-content:center}
  .prev-wrap img{max-width:100%;height:auto;border:1px solid var(--line-2);border-radius:4px}
  /* risk */
  .risk-row{background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:13px 16px;margin-bottom:10px;display:flex;gap:12px;align-items:flex-start}
  .risk-row .dot{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none;background:var(--ink-3)}
  .risk-row.ok .dot{background:var(--ok)} .risk-row.warn .dot{background:var(--warn)} .risk-row.bad .dot{background:var(--bad)}
  .risk-row .body{flex:1}
  .risk-row .body .h{font-weight:500;font-size:13px;margin-bottom:2px}
  .risk-row .body .d{font-size:12px;color:var(--ink-2)}
  .hint{font-size:12px;color:var(--ink-3);background:#fafbfc;border:1px dashed var(--line);border-radius:8px;padding:11px 14px;margin-bottom:16px;line-height:1.6}
  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(20,23,28,.28);z-index:40;display:none}
  .scrim.show{display:block}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:480px;max-width:92vw;background:var(--panel);border-left:1px solid var(--line);z-index:50;transform:translateX(100%);transition:transform .22s ease;display:flex;flex-direction:column}
  .drawer.show{transform:translateX(0)}
  .drawer-h{padding:15px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .drawer-h .t{font-weight:600;font-size:14px}
  .drawer-b{flex:1;overflow:auto;padding:14px 18px 30px}
  .grp{margin-bottom:20px}
  .grp .gh{font-size:11px;font-weight:600;letter-spacing:.6px;text-transform:uppercase;color:var(--ink-3);margin-bottom:9px}
  .cmd{border:1px solid var(--line);border-radius:8px;margin-bottom:9px;overflow:hidden}
  .cmd .ch{padding:10px 12px;cursor:pointer}
  .cmd .ch:hover{background:var(--hover)}
  .cmd .nm{font-family:var(--mono);font-size:12.5px;color:var(--ink);font-weight:500}
  .cmd .ds{font-size:11.5px;color:var(--ink-2);margin-top:3px}
  .cmd .co{display:none;padding:0 12px 12px;font-family:var(--mono);font-size:11.5px;color:#2a6e3f;background:#f6faf7;border-top:1px solid var(--line-2);padding-top:10px;white-space:pre-wrap;word-break:break-word}
  .cmd.open .co{display:block}
  .seal{font-size:11px;color:var(--ink-3)}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2329;color:#fff;font-size:12.5px;padding:8px 16px;border-radius:7px;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none}
  .toast.show{opacity:1}
  @media(max-width:760px){.side{display:none}}

/*BATCH_CSS*/
  /* ── segmented (doc / batch) ── */
  .seg{display:flex;background:var(--hover);border:1px solid var(--line);border-radius:7px;padding:2px;gap:2px}
  .seg button{border:none;background:transparent;height:26px;padding:0 13px;border-radius:5px;font-size:12.5px;color:var(--ink-2);cursor:pointer;font-family:var(--sans)}
  .seg button.on{background:var(--panel);color:var(--accent);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.05)}
  .topbar .search.hide{display:none}
  /* ── batch workbench ── */
  .shell.hidden{display:none}
  .bpane{padding:22px 28px 60px;max-width:1200px;display:flex;flex-direction:column;gap:16px}
  .bp-head{display:flex;align-items:flex-start;gap:14px}
  .bp-head .t{font-size:17px;font-weight:600}
  .bp-head .s{font-size:12px;color:var(--ink-3);margin-top:3px}
  .bp-head .acts{margin-left:auto;display:flex;gap:8px;flex:none}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:9px}
  .card-h{padding:11px 15px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;gap:10px}
  .card-h .t{font-size:12.5px;font-weight:600}
  .card-h .h{font-size:11.5px;color:var(--ink-3);margin-left:auto}
  .card-b{padding:14px 15px}
  .fgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px}
  .frow{display:grid;grid-template-columns:96px 1fr;gap:9px;align-items:center}
  .frow>label{font-size:12px;color:var(--ink-3);text-align:right}
  .frow input,.frow select{height:31px;border:1px solid var(--line);border-radius:6px;background:#fafbfc;
    padding:0 9px;font-size:12.5px;color:var(--ink);outline:none;font-family:var(--sans);width:100%}
  .frow input:focus,.frow select:focus{border-color:var(--accent);background:#fff}
  .frow input[type=checkbox]{width:15px;height:15px;accent-color:var(--accent);margin:0}
  .frow .num{width:74px}
  .chkrow{display:flex;flex-wrap:wrap;gap:16px}
  .chk{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer;user-select:none}
  /* 多输入源 chips */
  .srclist{display:flex;flex-direction:column;gap:6px}
  .srcline{display:grid;grid-template-columns:1fr 28px;gap:6px}
  .srcline input{font-family:var(--mono);font-size:11.5px;height:31px}
  .srcline button{border:1px solid var(--line);background:var(--panel);border-radius:6px;cursor:pointer;color:var(--ink-3);font-size:14px;line-height:1}
  .srcline button:hover{background:var(--hover);color:var(--bad)}
  .addsrc{border:1px dashed var(--line);background:#fafbfc;border-radius:6px;height:28px;cursor:pointer;
    font-size:11.5px;color:var(--ink-2);align-self:flex-start;padding:0 11px}
  .addsrc:hover{border-color:var(--accent);color:var(--accent)}
  /* bars / kpi / tables */
  .kpi{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:1px;background:var(--line);
    border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .kpi .c{background:var(--panel);padding:12px 14px}
  .kpi .c .k{font-size:11px;color:var(--ink-3)}
  .kpi .c .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px;letter-spacing:-.3px}
  .kpi .c .v small{font-size:11px;font-weight:400;color:var(--ink-3);margin-left:3px}
  .bars{display:flex;flex-direction:column;gap:8px}
  .bar-row{display:grid;grid-template-columns:116px 1fr 52px;gap:10px;align-items:center;font-size:12px;color:var(--ink-2)}
  .bar-track{height:8px;background:#f2f3f5;border-radius:5px;overflow:hidden}
  .bar-track i{display:block;height:100%;border-radius:5px;background:var(--accent)}
  .bar-track i.g{background:#1a8a4a} .bar-track i.y{background:#c8730a} .bar-track i.r{background:#d83931}
  .bar-track i.n{background:#8f959e}
  .bar-row .n{text-align:right;color:var(--ink-3);font-variant-numeric:tabular-nums}
  .hist{display:flex;align-items:flex-end;gap:8px;height:120px;padding:12px 0 0}
  .hist .col{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:5px;height:100%}
  .hist .col i{display:block;width:70%;background:var(--accent);border-radius:4px 4px 0 0;min-height:2px;opacity:.85}
  .hist .col span{font-size:10.5px;color:var(--ink-3);white-space:nowrap}
  .hist .col b{font-size:10.5px;color:var(--ink-2);font-weight:500}
  table.dt{width:100%;border-collapse:collapse;font-size:12.5px}
  table.dt th,table.dt td{text-align:left;padding:8px 12px;border-bottom:1px solid var(--line-2)}
  table.dt th{color:var(--ink-3);font-weight:500;background:#fafbfc;font-size:11.5px;letter-spacing:.3px}
  table.dt tr:last-child td{border-bottom:none}
  table.dt td.m{font-family:var(--mono);font-size:11.5px}
  .logbox{background:#1f2329;color:#e6e8eb;font-family:var(--mono);font-size:11.5px;line-height:1.72;
    padding:13px 15px;border-radius:9px;height:236px;overflow:auto;white-space:pre-wrap;word-break:break-all}
  .logbox .cm{color:#7c8493} .logbox .ok{color:#7ee2a8} .logbox .wn{color:#f0c674} .logbox .bd{color:#ff9b94} .logbox .ac{color:#79b8ff}
  .prog{height:6px;background:var(--line);border-radius:4px;overflow:hidden}
  .prog i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
  .tagline{font-size:11.5px;color:var(--ink-3);display:flex;align-items:center;gap:7px;flex-wrap:wrap}

  /* ── 12 条优化新增 ── */
  .logbox .fm{color:#c9a7f5}   /* [field] / [out] / env 提示 */
  .logbox .pl{color:#9fb4d0}   /* [plan] */
  .etaline{font-size:11.5px;color:var(--ink-3);margin:8px 0 10px;min-height:16px}
  /* 三段式：新增 / 重跑 / 失败 */
  .segbar{display:flex;height:9px;border-radius:5px;overflow:hidden;background:var(--line)}
  .segbar i{display:block;height:100%}
  .segbar .a{background:#3b6ef5} .segbar .r{background:#8ab4f8} .segbar .f{background:#e0574f}
  .segkey{display:flex;gap:16px;flex-wrap:wrap;margin-top:9px;font-size:11.5px;color:var(--ink-2)}
  .segkey span{display:flex;align-items:center;gap:6px}
  .segkey i{width:9px;height:9px;border-radius:2px;display:inline-block}
  .segkey .muted{color:var(--ink-3)}
  /* 明细 / 对比 / 字段对照表 */
  .dtwrap{max-height:420px;overflow:auto;border:1px solid var(--line-2);border-radius:8px}
  table.dt.diff td,table.dt.rows td,table.dt.cmp td{white-space:nowrap}
  table.dt td.dbad{background:#fff5e6;color:#8a5a00}
  table.dt .mk{white-space:nowrap;width:74px}
  .mkbtn{border:1px solid var(--line);background:var(--panel);color:var(--ink-3);width:26px;height:24px;
    border-radius:5px;cursor:pointer;font-size:12px;margin-right:4px;line-height:1}
  .mkbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .mkbtn[data-m="bad"].on{background:#e0574f;border-color:#e0574f}
  button.lnk{border:none;background:none;color:var(--accent);cursor:pointer;font-size:12px;padding:0}
  button.lnk:hover{text-decoration:underline}
  /* 侧栏任务勾选 */
  #bTaskList .item{padding-left:14px}
  .cmpbox{margin:3px 8px 0 0;flex:0 0 auto;align-self:flex-start}
  #bTaskList .item.active .cmpbox{margin-top:3px}
  .rescan{padding:10px 16px 0}
  /* 明细 / 对照两个小页签 */
  .tabs2{display:flex;gap:6px;margin-bottom:12px}
  .tabs2 button{border:1px solid var(--line);background:var(--panel);color:var(--ink-2);
    height:27px;padding:0 12px;border-radius:6px;font-size:12px;cursor:pointer;font-family:var(--sans)}
  .tabs2 button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  /* 数据集下拉分组 */
  #bDs optgroup{color:var(--ink-3);font-style:normal;font-size:11.5px}
/*BATCH_CSS_END*/


/*WORK_CSS*/
  /* ── 识别工作台 ── */
  .wpane,.cpane{padding:22px 28px 60px;max-width:1240px;display:flex;flex-direction:column;gap:16px}
  .drop{border:1.5px dashed var(--line);border-radius:12px;background:#fafbfc;
    padding:44px 20px;text-align:center;color:var(--ink-3);cursor:pointer;transition:.15s}
  .drop:hover,.drop.over{border-color:var(--accent);background:#f5f8ff;color:var(--ink-2)}
  .drop svg{width:38px;height:38px;margin-bottom:10px;opacity:.55}
  .drop .t{font-size:15px;font-weight:600;color:var(--ink)}
  .drop .s{font-size:12px;margin-top:6px}
  .wset{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .wset .frow{grid-template-columns:auto auto;gap:8px;margin:0}
  .wset select{height:31px;border:1px solid var(--line);border-radius:6px;background:#fafbfc;
    padding:0 9px;font-size:12.5px;color:var(--ink);font-family:var(--sans);min-width:300px}
  .wset .spacer{flex:1}
  .witem{display:flex;align-items:center;gap:10px;padding:9px 16px;border-bottom:1px solid var(--line-2);
    cursor:pointer;border-left:2px solid transparent}
  .witem:hover{background:var(--hover)}
  .witem.active{background:var(--sel);border-left-color:var(--accent)}
  .witem img{width:42px;height:42px;object-fit:cover;border-radius:5px;border:1px solid var(--line);flex:none}
  .witem .nothumb{width:42px;height:42px;border-radius:5px;border:1px solid var(--line);flex:none;
    display:flex;align-items:center;justify-content:center;font-size:11px;color:var(--ink-3);background:#fafbfc}
  .witem .m{flex:1;min-width:0}

/* ── helpers ── */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const num = v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};
function confBar(c){c=Number(c)||0;const p=Math.round(c*100);return `<span class="conf"><span class="bar"><i style="width:${p}%"></i></span>${p}%</span>`;}

/* ── state ── */
let active=null;
function filtered(){
  const q=$("#q").value.trim().toLowerCase();
  const ty=$("#ftype").value;
  const mn=num($("#fmin").value), mx=num($("#fmax").value);
  return DATA.docs.filter(d=>{
    if(ty && d.doc_type!==ty) return false;
    const am=num(d.amount_text)||num(d.details.primary_amount_value);
    if(mn!=null && (am==null||am<mn)) return false;
    if(mx!=null && (am==null||am>mx)) return false;
    if(q){const hay=(d.title+" "+(d.doc_type||"")+" "+d.sha+" "+JSON.stringify(d.details)).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}

/* ── render list ── */
function renderList(){
  const ds=filtered();
  $("#cnt").textContent=ds.length;
  const box=$("#list");
  if(!ds.length){box.innerHTML='<div class="empty">无匹配文档</div>';return;}
  box.innerHTML=ds.map(d=>`
    <div class="item ${active===d.id?'active':''}" data-id="${d.id}">
      <div class="top"><span class="ttl">${esc(d.title||("文档 #"+d.id))}</span><span class="amt">${esc(d.amount_text||"")}</span></div>
      <div class="sub"><span class="ty">${esc(d.doc_type||"未知")} · ${esc(d.sha)}</span>${confBar(d.confidence)}</div>
    </div>`).join("");
  box.querySelectorAll(".item").forEach(el=>el.onclick=()=>select(+el.dataset.id));
}

/* ── render detail ── */
function select(id){
  active=id; renderList();
  const d=DATA.docs.find(x=>x.id===id); if(!d) return;
  const det=d.details||{};
  const meta=[

/* ── 指标模型：抽取策略系数 × 数据集系数 ── */
const B_EXT = {
  rule  : {rate:7.8, items:.95, acc:{发票号码:.98,开票日期:1,销售方:1,购买方:.98,税额:1,价税合计:.95}, cost:0},
  llm   : {rate:1.5, items:.98, acc:{发票号码:1,开票日期:.98,销售方:.98,购买方:1,税额:.98,价税合计:1}, cost:1},
  hybrid: {rate:3.4, items:.99, acc:{发票号码:.99,开票日期:1,销售方:1,购买方:1,税额:1,价税合计:.99}, cost:.55}
};
const B_ACC_ORDER = ["发票号码","开票日期","销售方","购买方","税额","价税合计"];
function bMetrics(extractor, n){
  const e = B_EXT[extractor] || B_EXT.rule;
  const prop = bPreset();
  const scale = prop.accScale || 1;
  const total = Math.max(1, Math.round(n));
  const ok = Math.round(total * (prop.success ?? .98));
  const fail = total - ok;
  const w = Math.max(1, BState.workers);          /* 多进程边际收益递减 */
  const secPer = (60/e.rate) / Math.pow(w, .55);  /* rate 单位：张/分钟 → 秒/张 */
  const elapsed = +(total*secPer).toFixed(1);
  const acc = {}; let accSum=0;
  for(const k in e.acc){ const v = Math.min(1, +(e.acc[k]*scale).toFixed(3)); acc[k]=v; accSum+=v; }
  const avg = +(accSum/B_ACC_ORDER.length).toFixed(3);
  /* 耗时分布（秒/张） */
  const p50 = +(secPer*0.86).toFixed(2), p90 = +(secPer*1.24).toFixed(2),
        max = +(secPer*1.94).toFixed(2);
  const hist = [0,0,0,0,0];
  for(let i=0;i<total;i++){
    const t = p50 * (0.62 + 1.5*Math.pow((i%7)/6,1.6));
    const b = t< p50*0.75?0 : t< p50*0.95?1 : t< p50*1.2?2 : t< p50*1.6?3 : 4;
    hist[b]++;
  }
  return {total, ok, fail, elapsed, throughput:+(total/elapsed*60).toFixed(1),
          avgConf:+(0.88+avg*0.1).toFixed(3), acc, avgAcc:avg,
          itemsFull:+(e.items*scale).toFixed(3), vtype: prop.vtypes,
          el:{p50,p90,max}, hist, extractor, workers:w, cost:+(total*e.cost*(prop.costScale||1)).toFixed(2)};
}

/* ── 命令拼装（与 src/batch_run.py 参数一一对应）── */
function bCmd(){
  const p=[], a=BState;
  a.srcs.filter(Boolean).forEach(s=>p.push("--input "+JSON.stringify(s)));
  if(a.limit>0) p.push("--limit "+a.limit);
  if(a.offset>0) p.push("--offset "+a.offset);
  if(a.truth) p.push("--truth "+JSON.stringify(a.truth));
  if(a.base) p.push("--base "+JSON.stringify(a.base));
  if(a.extractor!=="rule") p.push("--extractor "+a.extractor);
  if(a.workers>1) p.push("--workers "+a.workers);
  if(a.out) p.push("--out "+a.out);
  if(a.resume) p.push("--resume");
  if(a.detail) p.push("--detail");
  return "python src/batch_run.py " + p.join(" ");
}

    wrap.querySelectorAll("button").forEach(b=>b.onclick=()=>{
      BState.srcs.splice(+b.dataset.i,1); if(!BState.srcs.length) BState.srcs=[""]; bRenderBody();});
  };
  draw();
  $b("#f_add").onclick=()=>{BState.srcs.push(""); bRenderBody();};
  const bind=(sel,key,cast)=>{const el=$(sel); if(!el) return;
    el.value = BState[key] ?? "";
    el.oninput = ()=>{ BState[key] = cast?cast(el.value):el.value; bRenderCmd(); };};
  bind("#f_base","base"); bind("#f_truth","truth"); bind("#f_out","out");
  bind("#f_limit","limit",v=>Math.max(0,parseInt(v||"0",10)||0));
  bind("#f_offset","offset",v=>Math.max(0,parseInt(v||"0",10)||0));
  bind("#f_ext","extractor"); bind("#f_w","workers",v=>Math.max(1,parseInt(v||"1",10)||1));
  const c=(sel,key)=>{const el=$(sel); if(!el) return; el.checked=!!BState[key];
    el.onchange=()=>{BState[key]=el.checked; bRenderCmd();};};
  c("#f_resume","resume"); c("#f_detail","detail");
  BState.out = $b("#f_out").value || "batch_out";
}

function bRenderCmd(){

/* ── 结果区 ── */
function bBar(label,v,cls,right){
  const pct=Math.round(Math.max(0,Math.min(1,v))*100);
  return '<div class="bar-row"><span>'+esc(label)+'</span>'+
    '<span class="bar-track"><i class="'+(cls||"")+'" style="width:'+pct+'%"></i></span>'+
    '<span class="n">'+(right||pct+"%")+'</span></div>';
}
function bNormAcc(src){
  const M={"发票号码":"invoice_number","开票日期":"invoice_date","销售方":"seller_name",
           "购买方":"client_name","税额":"tax","价税合计":"total"}, o={};
  B_ACC_ORDER.forEach(k=>{ const key=M[k]||k;
    o[k] = (src && (src[key]!==undefined ? src[key] : (src[k]!==undefined?src[k]:0))) || 0; });
  return o;
}
function bResult(m,kind){
  const acc=bNormAcc(m.accRaw||m.acc);
  const avgAll=B_ACC_ORDER.reduce((s,k)=>s+acc[k],0)/B_ACC_ORDER.length;
  const vt = m.vtk ? Object.keys(m.vtk).map(k=>[k,m.vtk[k]]) : (m.vtypes||[]);
  const lines=[];
  lines.push('<div class="sec-h">总览</div>');
  lines.push('<div class="kpi">'+
    bKpi("总数", m.total,"") + bKpi("成功", m.ok,"") + bKpi("失败", m.fail,"") +
    bKpi("总耗时", m.elapsed,"s") + bKpi("吞吐", m.throughput,"张/分") +
    bKpi("明细一致率", Math.round(m.itemsFull*100),"%") + "</div>");
  lines.push('<div class="sec-h" style="margin-top:22px">字段准确率<span class="pill '+
    (avgAll>=.95?"ok":"warn")+'" style="margin-left:8px">均值 '+(avgAll*100).toFixed(1)+'%</span></div>');
  lines.push('<div class="bars">'+B_ACC_ORDER.map(k=>bBar(k, acc[k]||0,
      (acc[k]||0)>=.99?"g":(acc[k]||0)>=.95?"":"y", ((acc[k]||0)*100).toFixed(1)+"%")).join("")+"</div>");
  if(m.hist){
  lines.push('<div class="sec-h" style="margin-top:22px">耗时分布（秒/张）</div>');
  lines.push('<div class="hist">'+m.hist.map((c,i)=>{
    const mx=Math.max.apply(null,m.hist)||1;
    const prev=[0,.75,.95,1.2,1.6][i], cut=[.75,.95,1.2,1.6,99][i];
    const lab = i===4 ? (">"+bFmt(m.el.p50*prev)+"s")
                      : (bFmt(m.el.p50*prev)+"-"+bFmt(m.el.p50*cut)+"s");
    return '<div class="col"><b>'+c+'</b><i style="height:'+Math.round(c/mx*88)+'%"></i><span>'+lab+'</span></div>';
  }).join("")+'</div>');
  } else {
    lines.push('<div class="sec-h" style="margin-top:22px">耗时统计（秒/张）</div><div class="bars">'+
      bBar("p50", Math.min(1,m.el.p50/20), "", bFmt(m.el.p50)+"s")+
      bBar("p90", Math.min(1,m.el.p90/20), "", bFmt(m.el.p90)+"s")+
      bBar("max", Math.min(1,m.el.max/20), "y", bFmt(m.el.max)+"s")+'</div>');
  }
  if(vt.length){
    lines.push('<div class="sec-h" style="margin-top:22px">票种分布</div><div class="bars">'+
      vt.map(v=>bBar(v[0], v[1]/m.total, "n", v[1]+" 张")).join("")+"</div>");
  }
  if(m.fail>0){
    lines.push('<div class="sec-h" style="margin-top:22px">失败清单</div>');
    lines.push('<table class="dt"><thead><tr><th>文件</th><th>原因</th><th>耗时</th></tr></thead><tbody>'+
      Array.from({length:Math.min(5,m.fail)},(_,i)=>
        '<tr><td class="m">sample_'+(m.total-m.fail+i+1)+'.jpg</td><td>OCR 未检出票面主字段</td><td>'+
        m.el.p50+'s</td></tr>').join("")+
      (m.fail>5?'<tr><td colspan="3" class="muted">…另有 '+(m.fail-5)+' 条，见 results.csv</td></tr>':'')+
      '</tbody></table>');
  }
  /* 策略对比 */
  const cmp=B_ACC_ORDER.map(k=>({k:k, v:B_EXT[BState.extractor]?B_EXT[BState.extractor].acc[k]:0}));
  lines.push('<div class="sec-h" style="margin-top:22px">同数据集三策略对比（准确率）</div>');
  lines.push('<div class="bars">'+["rule","hybrid","llm"].map(x=>{
    const mm=bMetrics(x, m.total);
    return bBar(x, mm.avgAcc, x===BState.extractor?"":"n",
      (mm.avgAcc*100).toFixed(1)+"% · "+mm.elapsed+"s");
  }).join("")+'</div>');
  return lines.join("");
}
function bKpi(k,v,u){ return '<div class="c"><div class="k">'+k+'</div><div class="v">'+v+
  (u?'<small>'+u+'</small>':'')+'</div></div>'; }

function bCsv(t){
  const rows=[["name","ok","vtype","avg_conf","line_count","elapsed","extractor","invoice_number","total","item_count"]];
  for(let i=0;i<t.metrics.total;i++) rows.push([t.name+"_"+i,"true","sample",t.metrics.avgConf,"18",

  const csv="\ufeff"+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(",")).join("\n");

/* ── 运行 ── */
function bNewTask(){ BState.cur=null; bRenderBody(); }
async function probeServer(){
  try{ const r=await fetch(LIVE_ORIGIN+"/api/health",{cache:"no-store"});
       if(!r.ok) return false; const j=await r.json(); return !!j.ok; }
  catch(e){ return false; }
}

function bPush(kind, m, name){
  m.el = m.el || {p50:0,p90:0,max:0};
  const t={idx:BState.tasks.length,
    name:name||((bPreset().short||"batch")+"_"+BState.extractor+"_"+(bPreset().files||m.total)+"_"+
      (new Date()).toTimeString().slice(0,5).replace(":","")),
    extractor:BState.extractor, total:m.total, elapsed:m.elapsed, metrics:m, kind:kind,
    ts:new Date().toISOString()};
  BState.tasks.push(t); BState.cur=t; bSave(); return t;
}
function bLiveQuery(){
  const p=new URLSearchParams();
  BState.srcs.filter(Boolean).forEach(s=>p.append("input",s));
  if(BState.limit>0) p.set("limit",BState.limit);
  if(BState.offset>0) p.set("offset",BState.offset);
  if(BState.truth) p.set("truth",BState.truth);
  if(BState.base) p.set("base",BState.base);
  p.set("extractor",BState.extractor);
  if(BState.workers>1) p.set("workers",BState.workers);
  if(BState.out) p.set("out",BState.out);
  if(BState.resume) p.set("resume","1");
  if(BState.detail) p.set("detail","1");
  return p.toString();
}
function bFromSummary(s){
  const el=s.elapsed||{};
  return {total:s.total||0, ok:s.ok||0, fail:s.failed||0,
    elapsed:+(el.wall||el.sum||0).toFixed(1),
    throughput:+(parseFloat(String(s.throughput||"0").replace(/[^0-9.]/g,""))||0),
    itemsFull:(function(){ const t=String(s.itemsFullMatch||"").split("/");
      return t.length===2 && +t[1] ? (+t[0]/+t[1]) : 0; })(),
    avgConf:0, accRaw:s.field_accuracy_vs_truth||{}, vtk:s.vtype_distribution||{},
    el:{p50:el.p50||0,p90:el.p90||0,max:el.max||0}, hist:null};
}
function bRunLive(put, prog, tx){
  return new Promise(res=>{
    let done=null, closed=false;
    const close=()=>{ if(closed) return; closed=true; try{ es.close(); }catch(e){} res(done); };
    const es=new EventSource(LIVE_ORIGIN+"/api/run?"+bLiveQuery());
    es.onerror=()=>{ if(!done) put("[error] 与本地后端断连，以下为已收到的输出","bd"); close(); };
    es.addEventListener("start", e=>{ try{ put("$ "+JSON.parse(e.data).cmd,"ac"); }catch(_){} });
    es.addEventListener("log", e=>{
      let line=""; try{ line=JSON.parse(e.data).line; }catch(_){ return; }
      put(line, /FAIL/.test(line)?"wn":(/overview|done|\[overview\]/.test(line)?"ok":""));
      const mm=line.match(/\[\s*(\d+)\s*\/\s*(\d+)\s*\]/);
      if(mm && tx){ prog.style.width=Math.round(mm[1]/mm[2]*100)+"%"; tx.textContent=mm[1]+" / "+mm[2]; }
    });
    es.addEventListener("done", e=>{
      let j={}; try{ j=JSON.parse(e.data).summary||{}; }catch(_){}
      done=bFromSummary(j);
      if(tx){ prog.style.width="100%"; tx.textContent=j.total+" / "+(j.total||0); }
      put("[done] 实跑返回 summary.json","ok");
      setTimeout(close, 400);
    });
    es.addEventListener("error", e=>{
      let msg="后端报错";
      try{ msg=JSON.parse(e.data||'{"message":"后端报错"}').message||msg; }catch(_){}
      put("[error] "+msg,"bd"); close();
    });
  });
}
async function bRun(){
  if(BState.running) return;
  BState.running=true;
  const n = BState.limit>0 ? Math.min(BState.limit, dsFiles()) : dsFiles();
  let live=false;
  try{ live = await probeServer(); }catch(e){ live=false; }
  const kind = live?"live":"sandbox";
  const m0 = bMetrics(BState.extractor, n);
  const body=$b("#bBody"); if(!body) { BState.running=false; return; }
  body.innerHTML = `
    <div class="bp-head"><div><div class="t">批量测试</div>
      <div class="s"><span class="pill ${kind==="live"?"ok":"warn"}">${kind==="live"?"实跑 · localhost":"样例 · 离线沙箱"}</span>
        ${esc(bPreset().short||"batch")} · ${esc(BState.extractor)} · ${n} 张</div></div>
      <div class="acts"><button class="btn" id="bStop">停止</button></div></div>
    <div id="bMid">${bRenderForm()}</div>
    <div class="card"><div class="card-h"><span class="t">执行</span><span class="h" id="bProgTx">0 / ${n}</span></div>
      <div class="card-b"><div class="prog"><i id="bProg"></i></div><div class="logbox" id="bLog"></div></div></div>`;
  bBindForm();
  const log=$b("#bLog"), prog=$b("#bProg"), tx=$b("#bProgTx");
  const put=(s,c)=>{ log.innerHTML+='<span class="'+(c||"cm")+'">'+esc(s)+"</span>\n";
    log.scrollTop=log.scrollHeight; };
  $("#bStop").onclick=()=>{ BState.running=false;
    if(BState.tasks.length) BState.tasks[BState.tasks.length-1].kind="stopped";
    bSave(); bRenderSide(); bRenderBody(); };
  put("$ "+bCmd(),"ac");

  if(live){
    const res = await bRunLive(put, prog, tx);
    BState.running=false;
    if(res && res.total){ const t=bPush("live", res); t.name=(bPreset().short||"batch")+"_"+BState.extractor+"_"+res.total; }
    bRenderSide(); setTimeout(bRenderBody, 300); return;
  }

  /* ── 离线沙箱：按参数推算并逐条演示 ── */
  const task={idx:BState.tasks.length, name:(bPreset().short||"batch")+"_"+BState.extractor+"_"+n+"_"+
      (new Date()).toTimeString().slice(0,5).replace(":",""),
    extractor:BState.extractor, total:m0.total, elapsed:m0.elapsed, metrics:m0, kind:"sandbox",
    ts:new Date().toISOString()};
  BState.tasks.push(task); BState.cur=task; bSave(); bRenderSide();
  put("[plan] 待跑 "+m0.total+" 张 | extractor="+BState.extractor+" | workers="+BState.workers+
      " | 模式=沙箱样例（未连接后端，指标由参数推算）","");
  let step=0;
  const lines=Math.max(1, Math.ceil(m0.total/4));
  function tick(){
    for(let i=0;i<lines && step<m0.total;i++,step++){
      const failAt = m0.total - m0.fail;
      const okf = step < failAt;
      put("[ "+(step+1)+"/"+m0.total+"] "+(bPreset().sample||"sample")+"_"+(step+1)+
          ((step+1)%10)+".jpg  "+(okf?"OK ":"FAIL")+"  conf="+
          (m0.avgConf-(step%3)*0.01).toFixed(2)+"  "+m0.el.p50+"s", okf?"ok":"wn");
    }
    prog.style.width=Math.round(step/m0.total*100)+"%";
    tx.textContent=step+" / "+m0.total;
    if(step<m0.total){ BState.timer=setTimeout(tick, Math.max(60, Math.min(1200, 24000/Math.max(1,m0.total)))); return; }
    put("[overview] 总数 "+m0.total+" | 成功 "+m0.ok+" | 失败 "+m0.fail+" | "+
        m0.elapsed+"s | "+m0.throughput+" 张/分钟","ok");
    put("[field] 字段准确率均值 "+(m0.avgAcc*100).toFixed(1)+"% | 明细条数全对 "+
        (m0.itemsFull*100).toFixed(0)+"%","");
    put("[out] "+esc(BState.out)+"/results.csv · summary.json · failed.txt","");
    put("[done] 沙箱样例：以上为演示输出。真实数字请复制上面的命令执行，或启动 tools/console_server.py 后重试。","wn");
    BState.timer=null; BState.running=false; bRenderSide();
    setTimeout(bRenderBody, 400);
  }
  tick();
}


/* ═══════════════ 批量测试 · 12 条优化 ═══════════════
   全部以「包装原函数」的方式挂载，不改动 build_batch_ui.py 里的原始实现：
   同名函数声明在后面重新赋值即可覆盖，原实现仍可通过 _orig* 调用。      */

const REVIEW_KEY = "ocr_review_marks";

/* ── 小工具 ── */
function bStore(k, def){ try{ return JSON.parse(localStorage.getItem(k)||JSON.stringify(def)); }catch(e){ return def; } }
function bStoreSet(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} }
function bMarks(){ return bStore(REVIEW_KEY, {}); }
function bMarkSet(k, v){ const m=bMarks(); if(v==null) delete m[k]; else m[k]=v; bStoreSet(REVIEW_KEY, m); }
function bMarkKey(name){ return (BState.out||"batch_out")+"::"+name; }
function bEtaSec(done, total, t0){
  if(!done || !total) return null;
  const el=(Date.now()-t0)/1000, per=el/done;
  return Math.max(0, Math.round(per*(total-done)));
}
function bEtaText(s){ if(s==null) return "";
  return s<60 ? ("约 "+s+" 秒") : ("约 "+Math.floor(s/60)+" 分 "+(s%60)+" 秒"); }

/* ══ ① 真实数据集自动探测 ══ */
async function bLoadDatasets(force){
  try{
    if(!(await probeServer())) return false;
    const r=await fetch(LIVE_ORIGIN+"/api/datasets"+(force?"?refresh=1":""),{cache:"no-store"});
    const j=await r.json();
    if(!j.ok || !Array.isArray(j.datasets)) return false;
    B_REMOTE = j.datasets.filter(d=>d && d.scan);
    const ids = new Set(B_PRESETS.map(p=>p.id));
    B_REMOTE.forEach(d=>{
      if(ids.has(d.id)) return;
      ids.add(d.id);
      B_PRESETS.push({id:d.id, label:d.label, short:d.short||d.id, files:d.files||0,
        sample:"scan", success:.985, accScale:1, costScale:1,
        vtypes:{"intl-commercial":d.files||0}, scan:true,
        default_src:d.src, default_truth:d.truth||""});
    });
    return true;
  }catch(e){ return false; }
}
function bDsOptions(){
  const bi=B_PRESETS.filter(p=>!p.scan), sc=B_PRESETS.filter(p=>p.scan);
  const opt=p=>'<option value="'+esc(p.id)+'">'+esc(p.label)+'</option>';
  let h = bi.length ? '<optgroup label="仓库内置">'+bi.map(opt).join("")+'</optgroup>' : "";
  if(sc.length) h += '<optgroup label="本机扫描（--scan）">'+sc.map(opt).join("")+'</optgroup>';
  else h += '<optgroup label="本机扫描"><option disabled>未配置：python tools/console_server.py --scan &lt;目录&gt;</option></optgroup>';
  return h;
}
function bRefreshDs(){
  const sel=$b("#bDs"); if(!sel) return;
  sel.innerHTML=bDsOptions(); sel.value=BState.ds;
}

/* ══ ④ 断点续跑：读上一次的结果，算出「新增 / 重跑 / 失败」══ */
async function bPrevRun(out){
  try{
    const r=await fetch(LIVE_ORIGIN+"/api/results?out="+encodeURIComponent(out||"batch_out"),{cache:"no-store"});
    const j=await r.json();
    if(!j.ok) return null;
    return {rows:j.rows||[],
            ok:new Set((j.rows||[]).filter(x=>String(x.ok).toLowerCase()==="true").map(x=>x.name))};
  }catch(e){ return null; }
}
function bSandboxRows(m, prefix){
  /* 沙箱没有真实 results.csv，按指标合成一批行，让明细表 / 字段对照 / 复核标记照样能用 */
  const rows=[]; const pre=prefix||(bPreset().sample||"sample");
  for(let i=0;i<m.total;i++){
    const okf = i < m.ok;
    rows.push({name:pre+"_"+(i+1)+".jpg", ok:okf?"True":"False",
      vtype:"intl-commercial", vtype_name:"英文商发",
      avg_conf:String(m.avgConf-(i%3)*0.01), line_count:"18",
      elapsed:String(m.el.p50), extractor:BState.extractor,
      invoice_number:"SYN"+String(i+1).padStart(6,"0"),
      invoice_date:"2026-0"+((i%9)+1)+"-1"+((i%9)),
      seller_name:"示例供应商 "+(i+1), client_name:"示例采购中心",
      tax:(100+i*7.3).toFixed(2), total:(1000+i*73.5).toFixed(2),
      item_count:"3", error:okf?"":"OCR 未检出票面主字段"});
  }
  return rows;
}
function bSegOf(prev, rows){
  /* 三段式：本次新跑出来的 / 上次已有这次又跑了一遍 / 失败 */
  const pOK = prev ? prev.ok : new Set();
  let add=0, again=0, fail=0;
  (rows||[]).forEach(r=>{
    const ok = String(r.ok).toLowerCase()==="true";
    if(!ok){ fail++; return; }
    if(pOK.has(r.name)) again++; else add++;
  });
  return {add, again, fail, prevTotal:pOK.size};
}
function bSegBar(seg){
  const tot=Math.max(1, seg.add+seg.again+seg.fail);
  const pc=n=>Math.round(n/tot*100);
  return '<div class="segbar"><i class="a" style="width:'+pc(seg.add)+'%"></i>'+
    '<i class="r" style="width:'+pc(seg.again)+'%"></i>'+
    '<i class="f" style="width:'+pc(seg.fail)+'%"></i></div>'+
    '<div class="segkey"><span><i class="a"></i>新增 '+seg.add+'</span>'+
    '<span><i class="r"></i>重跑 '+seg.again+'</span>'+
    '<span><i class="f"></i>失败 '+seg.fail+'</span>'+
    (seg.prevTotal?'<span class="muted">上次已成功 '+seg.prevTotal+' 张（--resume 会跳过）</span>':'')+
    '</div>';
}

/* ══ ⑥ 跳文档档案视图 ══ */

function bOpenInDocs(r, idx){

/* ══ ⑦ 字段横向差异对照 ══ */
const B_DIFF_FIELDS=[["invoice_number","发票号码"],["invoice_date","开票日期"],
  ["seller_name","销售方"],["client_name","购买方"],["tax","税额"],["total","价税合计"]];
function bDiffBad(k, v){
  v=String(v==null?"":v).trim();
  if(!v) return "缺失";
  if(k==="invoice_number" && !/[0-9]/.test(v)) return "无数字";
  if(k==="invoice_date"   && !/[0-9]{4}|[0-9]{2}\/[0-9]{2}\/[0-9]{4}/.test(v)) return "日期格式";
  if((k==="tax"||k==="total") && !/^[0-9][0-9.,\-]*$/.test(v)) return "非数值";
  return "";
}
function bDiffHtml(rows){
  const rws=(rows||[]).slice(0,200);
  if(!rws.length) return '<div class="hint">没有可对照的结果（实跑后才有 results.csv）。</div>';
  let h='<div class="hint">列=字段，行=文件。<span class="dbad">橙色</span>表示该字段缺失或格式可疑，用来找系统性偏差，而不是只看均值。</div>';
  h+='<div class="dtwrap"><table class="dt diff"><thead><tr><th>文件</th>'+
     B_DIFF_FIELDS.map(f=>'<th>'+f[1]+'</th>').join("")+'</tr></thead><tbody>';
  rws.forEach(r=>{
    h+='<tr><td class="m">'+esc(r.name)+'</td>'+
      B_DIFF_FIELDS.map(f=>{ const why=bDiffBad(f[0], r[f[0]]);
        return '<td class="'+(why?'dbad':'')+'" title="'+esc(why)+'">'+esc(r[f[0]]||"—")+'</td>'; }).join("")+
      '</tr>';
  });
  h+='</tbody></table></div>';
  const cnt={}; B_DIFF_FIELDS.forEach(f=>cnt[f[1]]=0);
  rws.forEach(r=>B_DIFF_FIELDS.forEach(f=>{ if(bDiffBad(f[0], r[f[0]])) cnt[f[1]]++; }));
  h+='<div class="bars" style="margin-top:12px">'+
     B_DIFF_FIELDS.map(f=>bBar(f[1]+" 异常", cnt[f[1]]/rws.length, cnt[f[1]]?"y":"g", cnt[f[1]]+" / "+rws.length)).join("")+
     '</div>';
  return h;
}

/* ══ ⑧ 日志分色 ══ */
function bLogClass(line){
  if(/^\$/.test(line)) return "ac";
  if(/\[error\]|Traceback|Error:/.test(line)) return "bd";
  if(/\[warn\]|\[done\] 沙箱/.test(line)) return "wn";
  if(/\[overview\]|\[done\] 实跑/.test(line)) return "ok";
  if(/\[field\]/.test(line)) return "fm";
  if(/\[plan\]/.test(line)) return "pl";
  if(/\[out\]/.test(line)) return "fm";
  if(/\bFAIL\b/.test(line)) return "wn";
  return "cm";
}

/* ══ ⑩ 导出 Markdown / JSON ══ */
function bReport(kind){
  const cur=BState.cur; if(!cur){ toast("先跑一次"); return; }
  const m=cur.metrics, acc=bNormAcc(m.accRaw||m.acc);
  const marks=bMarks(); const rows=cur.rows||[];
  const bad=rows.filter(r=>marks[bMarkKey(r.name)]==="bad").length;
  const good=rows.filter(r=>marks[bMarkKey(r.name)]==="ok").length;
  const obj={
    task:cur.name, kind:cur.kind, extractor:cur.extractor, out:BState.out,
    cmd:bCmd(), ts:cur.ts,
    total:m.total, ok:m.ok, fail:m.fail, elapsed:m.elapsed, throughput:m.throughput,
    items_full_match:m.itemsFull, avg_accuracy:m.avgAcc,
    field_accuracy:acc,
    review:{checked:good+bad, wrong:bad, rate:(good+bad)?+(bad/(good+bad)).toFixed(3):null}
  };
  if(kind==="json"){
    const a=document.createElement("a");
    a.href=URL.createObjectURL(new Blob([JSON.stringify(obj,null,2)],{type:"application/json"}));
    a.download="batch_report_"+Date.now()+".json"; a.click(); toast("已导出 JSON"); return;
  }
  const pct=v=>(+(v||0)*100).toFixed(1)+"%";
  let md="# 批量测试报告\n\n";
  md+="- 任务："+cur.name+"　模式："+(cur.kind==="live"?"实跑":"样例沙箱")+"\n";
  md+="- 抽取策略："+cur.extractor+"　输出目录：`"+BState.out+"`\n";
  md+="- 命令：`"+bCmd()+"`\n\n";
  md+="## 总览\n\n| 指标 | 值 |\n| :- | :- |\n";
  md+="| 总数 | "+m.total+" |\n| 成功 | "+m.ok+" |\n| 失败 | "+m.fail+" |\n";
  md+="| 总耗时 | "+m.elapsed+"s |\n| 吞吐 | "+m.throughput+" 张/分 |\n";
  md+="| 明细一致率 | "+pct(m.itemsFull)+" |\n| 字段准确率均值 | "+pct(m.avgAcc)+" |\n\n";
  md+="## 字段准确率\n\n| 字段 | 准确率 |\n| :- | :- |\n";
  B_ACC_ORDER.forEach(k=>{ md+="| "+k+" | "+pct(acc[k])+" |\n"; });
  if(good+bad){
    md+="\n## 抽样复核\n\n共复核 "+(good+bad)+" 张，判错 "+bad+" 张，错误率 "+
        ((bad/(good+bad))*100).toFixed(1)+"%。\n";
  }
  md+="\n> "+(cur.kind==="live"
      ? "实跑结果，来自 `"+BState.out+"/summary.json`。"
      : "样例沙箱结果：指标由所选参数推算，用于演示评估口径，非真实跑批。")+"\n";
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([md],{type:"text/markdown"}));
  a.download="batch_report_"+Date.now()+".md"; a.click(); toast("已导出 Markdown");
}

/* ══ ⑪ 抽样复核标记 ══ */
function bReviewBar(rows){
  const m=bMarks();
  let bad=0, good=0;
  (rows||[]).forEach(r=>{ const v=m[bMarkKey(r.name)]; if(v==="bad") bad++; else if(v==="ok") good++; });
  const n=good+bad;
  return n ? ('<span class="pill '+(bad?"warn":"ok")+'">已复核 '+n+' 张 · 判错 '+bad+
              ' · 错误率 '+(bad/n*100).toFixed(1)+'%</span>') : '';
}
function bRowsHtml(rows, kind){
  if(!rows || !rows.length) return '<div class="hint">没有明细行。</div>';
  const m=bMarks();
  let h='<div class="dtwrap"><table class="dt rows"><thead><tr><th>复核</th><th>文件</th><th>结果</th>'+
    '<th>票种</th><th>置信</th><th>耗时</th><th>发票号码</th><th>价税合计</th><th>明细</th><th></th>'+
    '</tr></thead><tbody>';
  rows.slice(0,300).forEach((r,i)=>{
    const ok=String(r.ok).toLowerCase()==="true";
    const mk=m[bMarkKey(r.name)]||"";
    h+='<tr data-n="'+esc(r.name)+'">'+
      '<td class="mk"><button class="mkbtn '+(mk==="ok"?"on":"")+'" data-m="ok" title="复核无误">✓</button>'+
      '<button class="mkbtn '+(mk==="bad"?"on":"")+'" data-m="bad" title="判错">✗</button></td>'+
      '<td class="m">'+esc(r.name)+'</td>'+
      '<td>'+(ok?'<span class="pill ok">OK</span>':'<span class="pill bad">FAIL</span>')+'</td>'+
      '<td>'+esc(r.vtype_name||r.vtype||"—")+'</td>'+
      '<td>'+esc(r.avg_conf||"—")+'</td><td>'+esc(r.elapsed||"—")+'s</td>'+
      '<td>'+esc(r.invoice_number||"—")+'</td><td>'+esc(r.total||"—")+'</td>'+
      '<td>'+esc(r.item_count||"—")+'</td>'+
      '<td><button class="lnk" data-i="'+i+'">档案视图 ›</button></td></tr>';
  });
  h+='</tbody></table></div>';
  if(rows.length>300) h+='<div class="hint">仅显示前 300 行。</div>';
  return h;
}
function bBindRows(box, rows){
  box.querySelectorAll(".mkbtn").forEach(b=>b.onclick=()=>{
    const n=b.closest("tr").dataset.n, v=b.dataset.m;
    const cur=bMarks()[bMarkKey(n)];
    bMarkSet(bMarkKey(n), cur===v?null:v);
    bEnhance();
  });
  box.querySelectorAll(".lnk").forEach(b=>b.onclick=()=>{
    const r=rows[+b.dataset.i]; if(r) bOpenInDocs(r, +b.dataset.i);
  });
}

/* ══ ③ 多任务对比 ══ */
function bCompareHtml(){
  const sel=(BState.cmp||[]).map(i=>BState.tasks[i]).filter(Boolean);
  if(sel.length<2) return '<div class="hint">至少勾选两个任务。</div>';
  const cols=["策略","张数","总耗时","吞吐","明细一致率","准确率均值"].concat(B_ACC_ORDER);
  let h='<div class="dtwrap"><table class="dt cmp"><thead><tr><th>任务</th>'+
    cols.map(c=>'<th>'+c+'</th>').join("")+'</tr></thead><tbody>';
  sel.forEach(t=>{
    const m=t.metrics, acc=bNormAcc(m.accRaw||m.acc);
    h+='<tr><td class="m">'+esc(t.name)+' <span class="pill '+(t.kind==="live"?"ok":"warn")+'">'+
       (t.kind==="live"?"实跑":"样例")+'</span></td>'+
      '<td>'+esc(t.extractor)+'</td><td>'+m.total+'</td><td>'+m.elapsed+'s</td>'+
      '<td>'+m.throughput+'</td><td>'+Math.round(m.itemsFull*100)+'%</td>'+
      '<td><b>'+(m.avgAcc*100).toFixed(1)+'%</b></td>'+
      B_ACC_ORDER.map(k=>'<td>'+((acc[k]||0)*100).toFixed(1)+'%</td>').join("")+'</tr>';
  });
  h+='</tbody></table></div>';
  /* 谁最快 / 谁最准 */
  const fast=sel.slice().sort((a,b)=>a.metrics.elapsed-b.metrics.elapsed)[0];
  const best=sel.slice().sort((a,b)=>b.metrics.avgAcc-a.metrics.avgAcc)[0];
  h+='<div class="hint">最快：<b>'+esc(fast.name)+'</b>（'+fast.metrics.elapsed+'s）；'+
     '最准：<b>'+esc(best.name)+'</b>（'+(best.metrics.avgAcc*100).toFixed(1)+'%）。'+
     (fast===best?'　两者是同一个任务，这个策略在这个数据集上没有取舍。':'　二者不同，按你要的是速度还是准确率选。')+
     '</div>';
  return h;
}

/* ══ 结果区增强：把上面这些挂进 #bExt ══ */
function bEnhance(){
  const ext=$b("#bExt"); if(!ext) return;
  const cur=BState.cur;
  if(!cur){ ext.innerHTML=""; return; }
  const rows=cur.rows||[];
  const seg=cur.seg;
  if(BState.cmpOpen){
    ext.innerHTML='<div class="card"><div class="card-h"><span class="t">多任务对比</span>'+
      '<span class="h"><button class="btn" id="bCmpX">关闭对比</button></span></div>'+
      '<div class="card-b">'+bCompareHtml()+'</div></div>';
    const x=$b("#bCmpX"); if(x) x.onclick=()=>{BState.cmpOpen=false; bEnhance();};
    return;
  }
  let h="";
  if(seg && (seg.prevTotal||seg.again)){
    h+='<div class="card"><div class="card-h"><span class="t">断点续跑</span>'+
       '<span class="h">与上一次 '+esc(BState.out||"batch_out")+' 的结果比对</span></div>'+
       '<div class="card-b">'+bSegBar(seg)+'</div></div>';
  }
  if(rows.length){
    h+='<div class="card"><div class="card-h"><span class="t">结果明细</span>'+
      '<span class="h">'+bReviewBar(rows)+'</span></div>'+
      '<div class="card-b"><div class="tabs2">'+
      '<button class="on" data-t="rows">明细</button><button data-t="diff">字段对照</button></div>'+
      '<div id="bRowsBox">'+bRowsHtml(rows, cur.kind)+'</div></div></div>';
  }
  ext.innerHTML=h;
  const box=$b("#bRowsBox");
  if(box){
    bBindRows(box, rows);
    box.parentElement.querySelectorAll(".tabs2 button").forEach(b=>b.onclick=()=>{
      box.parentElement.querySelectorAll(".tabs2 button").forEach(x=>x.classList.toggle("on", x===b));
      box.innerHTML = b.dataset.t==="diff" ? bDiffHtml(rows) : bRowsHtml(rows, cur.kind);
      if(b.dataset.t!=="diff") bBindRows(box, rows);
    });
  }
}

/* ══ 运行：ETA + 中止 + 续跑 + 三段式（重写 bRun）══ */
async function bRun(){
  if(BState.running) return;
  BState.running=true; BState.abort=false;
  BState.taskId="t"+Date.now();
  const n = BState.limit>0 ? Math.min(BState.limit, dsFiles()) : dsFiles();
  let live=false;
  try{ live = await probeServer(); }catch(e){ live=false; }
  const kind = live?"live":"sandbox";
  BState.mode=kind;

  /* 续跑：先读上一次已成功的名单 */
  let prev=null;
  if(live){ prev = await bPrevRun(BState.out); }

  const body=$b("#bBody"); if(!body){ BState.running=false; return; }
  body.innerHTML = `
    <div class="bp-head"><div><div class="t">批量测试</div>
      <div class="s"><span class="pill ${kind==="live"?"ok":"warn"}">${kind==="live"?"实跑 · localhost":"样例 · 离线沙箱"}</span>
        ${esc(bPreset().short||"batch")} · ${esc(BState.extractor)} · ${n} 张
        ${prev&&prev.ok.size?' · 上次已成功 '+prev.ok.size+' 张':''}</div></div>
      <div class="acts"><button class="btn" id="bStop">中止</button></div></div>
    <div id="bMid">${bRenderForm()}</div>
    <div class="card"><div class="card-h"><span class="t">执行</span><span class="h" id="bProgTx">0 / ${n}</span></div>
      <div class="card-b"><div class="prog"><i id="bProg"></i></div>
        <div class="etaline" id="bEta"></div>
        <div class="logbox" id="bLog"></div></div></div>
    <div id="bExt"></div>`;
  bBindForm();
  const log=$b("#bLog"), prog=$b("#bProg"), tx=$b("#bProgTx"), eta=$b("#bEta");
  const t0=Date.now();
  const put=(s,c)=>{ log.innerHTML+='<span class="'+(c||bLogClass(s))+'">'+esc(s)+"</span>\n";
    log.scrollTop=log.scrollHeight; };
  const progTo=(done,total)=>{
    prog.style.width=Math.round(done/Math.max(1,total)*100)+"%";
    tx.textContent=done+" / "+total;
    const s=bEtaSec(done,total,t0);
    eta.textContent = (done<total && s!=null) ? ("已完成 "+done+"/"+total+" · 预计剩余 "+bEtaText(s)) :
                      (done>=total ? ("完成 "+total+" 张 · 用时 "+((Date.now()-t0)/1000).toFixed(1)+"s") : "");
  };
  $b("#bStop").onclick=()=>{
    if(!BState.running) return;
    BState.running=false; BState.abort=true;
    if(BState.es){ try{BState.es.close();}catch(e){} BState.es=null; }
    if(BState.timer){ clearTimeout(BState.timer); BState.timer=null; }
    if(live) fetch(LIVE_ORIGIN+"/api/stop?task="+encodeURIComponent(BState.taskId)).catch(()=>{});
    put("[warn] 已中止。已写入 "+esc(BState.out)+"/results.csv 的部分保留，下次 --resume 会跳过。","wn");
    bRenderSide(); bRenderBody();
  };
  put("$ "+bCmd(),"ac");
  if(prev && prev.ok.size)
    put("[plan] 上次已成功 "+prev.ok.size+" 张；本次结果会按「新增 / 重跑 / 失败」三段统计","pl");

  /* ── 实跑 ── */
  if(live){
    let res=null;
    await new Promise(r=>{
      const es=new EventSource(LIVE_ORIGIN+"/api/run?"+bLiveQuery());
      BState.es=es;
      es.addEventListener("start", e=>{ try{ const d=JSON.parse(e.data);
        put("$ "+d.cmd,"ac");
        if(d.env && Object.keys(d.env).length)
          put("[env] LLM 凭据已注入子进程："+Object.keys(d.env).join("、")+"（不明文回显）","fm");
      }catch(_){} });
      es.addEventListener("log", e=>{
        let line=""; try{ line=JSON.parse(e.data).line; }catch(_){ return; }
        put(line);
        const mm=line.match(/\[\s*(\d+)\s*\/\s*(\d+)\s*\]/);
        if(mm) progTo(+mm[1], +mm[2]);
      });
      es.addEventListener("done", e=>{
        let j={}; try{ j=JSON.parse(e.data).summary||{}; }catch(_){}
        res=bFromSummary(j);
        put("[done] 实跑返回 summary.json","ok");
        if(BState.es===es) BState.es=null;
        es.close(); r();
      });
      es.addEventListener("error", e=>{
        let msg="后端报错";
        try{ msg=JSON.parse(e.data||'{"message":"后端报错"}').message||msg; }catch(_){}
        put("[error] "+msg,"bd");
        if(BState.es===es) BState.es=null;
        es.close(); r();
      });
      es.onerror=()=>{ if(BState.abort) { r(); return; }
        put("[error] 与本地后端断连","bd");
        if(BState.es===es) BState.es=null; es.close(); r(); };
    });
    BState.running=false;
    if(res && res.total){
      const t=bPush("live", res, (bPreset().short||"batch")+"_"+BState.extractor+"_"+res.total);
      t.out=BState.out;
      const after=await bPrevRun(BState.out);
      t.rows = after ? after.rows : [];
      t.seg  = bSegOf(prev, t.rows);
      BState.cur=t; bSave();
      if(t.seg) put("[overview] 新增 "+t.seg.add+" · 重跑 "+t.seg.again+" · 失败 "+t.seg.fail,"ok");
    }
    bRenderSide(); setTimeout(bRenderBody, 200);
    return;
  }

  /* ── 离线沙箱 ── */
  const m0=bMetrics(BState.extractor, n);
  const task={idx:BState.tasks.length,
    name:(bPreset().short||"batch")+"_"+BState.extractor+"_"+n+"_"+
      (new Date()).toTimeString().slice(0,5).replace(":",""),
    extractor:BState.extractor, total:m0.total, elapsed:m0.elapsed, metrics:m0, kind:"sandbox",
    ts:new Date().toISOString(), out:BState.out,
    rows:bSandboxRows(m0), seg:null};
  task.seg=bSegOf({ok:new Set()}, task.rows);
  BState.tasks.push(task); BState.cur=task; bSave(); bRenderSide();
  put("[plan] 待跑 "+m0.total+" 张 | extractor="+BState.extractor+" | workers="+BState.workers+
      " | 模式=沙箱样例（未连接后端，指标由参数推算）","pl");
  let step=0;
  const lines=Math.max(1, Math.ceil(m0.total/4));
  function tick(){
    if(BState.abort) return;
    for(let i=0;i<lines && step<m0.total;i++,step++){
      const failAt=m0.total-m0.fail, okf=step<failAt;
      put("[ "+(step+1)+"/"+m0.total+"] "+(bPreset().sample||"sample")+"_"+(step+1)+
          ".jpg  "+(okf?"OK ":"FAIL")+"  conf="+
          (m0.avgConf-(step%3)*0.01).toFixed(2)+"  "+m0.el.p50+"s");
    }
    progTo(step, m0.total);
    if(step<m0.total){ BState.timer=setTimeout(tick, Math.max(60, Math.min(1200, 24000/Math.max(1,m0.total)))); return; }
    put("[overview] 总数 "+m0.total+" | 成功 "+m0.ok+" | 失败 "+m0.fail+" | "+
        m0.elapsed+"s | "+m0.throughput+" 张/分钟","ok");
    put("[field] 字段准确率均值 "+(m0.avgAcc*100).toFixed(1)+"% | 明细条数全对 "+
        (m0.itemsFull*100).toFixed(0)+"%","fm");
    put("[out] "+BState.out+"/results.csv · summary.json · failed.txt","fm");
    put("[done] 沙箱样例：以上为演示输出。真实数字请复制上面的命令执行，或启动 tools/console_server.py 后重试。","wn");
    BState.timer=null; BState.running=false; bRenderSide();
    setTimeout(bRenderBody, 400);
  }
  tick();
}

/* ═══════════════ 识别工作台 + 合规页 ═══════════════
   顶栏四个视图：work（识别）/ doc（档案）/ batch（批量）/ comp（合规）。
   识别页是主入口——用户第一件事就是把发票拖进来。                        */

const W = {
  files: [],        /* {id, file, name, size, url, state:'wait'|'run'|'ok'|'fail', rec, err} */
  cur: null, running: false, abort: false,
  ext: "rule", comp: false, online: false, nextId: 1
};
const $w = s => document.querySelector(s);

/* ── 页头小工具 ── */
function wPill(kind, txt){
  return '<span class="pill ' + kind + '">' + esc(txt) + '</span>';
}
function wSize(b){
  if (b < 1024) return b + " B";
  if (b < 1024 * 1024) return (b / 1024).toFixed(0) + " KB";
  return (b / 1024 / 1024).toFixed(1) + " MB";
}
function wOffline(){
  /* 后端不在时，这些功能就是做不了——如实说，不要给假结果 */
  return '<div class="card"><div class="card-b"><div class="offline">' +
    '<div class="h">需要本地后端才能真跑识别</div>' +
    '<div class="d">单文件 HTML 里没有 Python 运行时，OCR 必须在本机执行。启动方式：</div>' +
    '<pre class="code">python tools/console_server.py --python &lt;装了OCR依赖的解释器&gt;</pre>' +
    '<div class="d">启动后本页会自动连上（默认 <span class="mono">http://127.0.0.1:8770</span>）。' +
    '连不上时下面的功能区保持只读，不会给你编造识别结果。</div>' +
    '</div></div></div>';
}

/* ══════════════ 识别页 ══════════════ */
function wDropHtml(){
  if (W.files.length) return "";
  return `
  <div class="drop" id="wDrop">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M12 16V4m0 0L8 8m4-4 4 4"/><path d="M3 16v3a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-3"/>
    </svg>
    <div class="t">把发票图片拖到这里</div>
    <div class="s">单张或多张都行 · jpg / png / webp / bmp / tif · 单张 ≤ 30MB</div>
    <button class="btn primary" id="wDropBtn" style="margin-top:14px">选择文件</button>
    <div class="s" style="margin-top:12px">图片只发到本机 127.0.0.1 的后端，不会上传到任何外部服务</div>
  </div>`;
}

function wFormHtml(){
  return `
  <div class="card">
    <div class="card-h"><span class="t">识别设置</span>
      <span class="h">策略影响速度与准确率；合规链路会顺带跑「取原件 → 验签 → 查验」</span></div>
    <div class="card-b">
      <div class="wset">
        <div class="frow"><label>抽取策略</label>
          <select id="wExt">
            <option value="rule">rule（规则抽取，快，约 5-8 秒/张）</option>
            <option value="hybrid">hybrid（规则 + 大模型融合）</option>
            <option value="llm">llm（大模型抽取，慢但稳）</option>
          </select></div>
        <label class="chk"><input type="checkbox" id="wComp">跑合规链路</label>
        <span class="spacer"></span>
        <button class="btn" id="wAdd">+ 添加更多</button>
        <button class="btn primary" id="wGo">开始识别</button>
        <button class="btn" id="wStop" style="display:none">中止</button>
      </div>
    </div>
  </div>`;
}

function wFileList(){
  if (!W.files.length) return "";
  return W.files.map((f, i) => {
    const st = f.state === "ok" ? wPill("ok", "已识别")
      : f.state === "fail" ? wPill("bad", "失败")
      : f.state === "run" ? wPill("warn", "识别中")
      : wPill("", "待识别");
    const vt = f.rec && f.rec.vtype ? esc(f.rec.vtype.short || f.rec.vtype.name || "") : "";
    return '<div class="witem' + (W.cur === f.id ? " active" : "") + '" data-i="' + i + '">' +
      (f.url ? '<img src="' + f.url + '" alt="">' : '<div class="nothumb">图</div>') +
      '<div class="m"><div class="n">' + esc(f.name) + '</div>' +
      '<div class="s">' + wSize(f.size) + ' · ' + vt + ' ' + st + '</div></div>' +
      '<button class="x" data-x="' + i + '" title="移除">×</button></div>';
  }).join("");
}

function wRenderSide(){
  const c = $w("#wCnt"); if (c) c.textContent = W.files.length + " 个";
  const l = $w("#wList"); if (!l) return;
  if (!W.files.length) {
    l.innerHTML = '<div class="item"><div class="sub"><span class="ty">还没有文件</span></div></div>';
    return;
  }
  l.innerHTML = wFileList();
  l.querySelectorAll(".witem").forEach(el => el.onclick = e => {
    if (e.target.dataset.x !== undefined) return;
    W.cur = W.files[+el.dataset.i].id; wRenderBody();
  });
  l.querySelectorAll(".x").forEach(b => b.onclick = e => {
    e.stopPropagation();
    const i = +b.dataset.x;
    if (W.files[i].url) URL.revokeObjectURL(W.files[i].url);
    W.files.splice(i, 1); wRenderSide(); wRenderBody();
  });
}

function wAddFiles(list){
  const ok = [];
  for (const f of list) {
    const ext = (f.name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
    if (![".jpg", ".jpeg", ".png", ".webp", ".bmp", ".tif", ".tiff"].includes(ext)) continue;
    if (f.size > 30 * 1024 * 1024) continue;
    /* 预览图地址不一定拿得到（非浏览器环境、或策略限制），拿不到就用占位块，别整条挂掉 */
    let url = "";
    try { url = URL.createObjectURL(f); } catch (e) { url = ""; }
    ok.push({ id: W.nextId++, file: f, name: f.name, size: f.size,
              url: url, state: "wait", rec: null, err: "" });
  }
  if (!ok.length) { toast("没有可用图片（仅 jpg/png/webp/bmp/tif，单张 ≤30MB）"); return; }
  W.files = W.files.concat(ok);
  if (!W.cur) W.cur = ok[0].id;
  wRenderSide(); wRenderBody();
  toast("已加入 " + ok.length + " 个文件");
}

async function wRunOne(f, i, n, t0){
  const fd = new FormData();
  fd.append("file", f.file, f.name);
  fd.append("extractor", W.ext);
  fd.append("compliance", W.comp ? "1" : "0");
  const cfg = bLlm();
  if (cfg.apiKey) fd.append("apiKey", cfg.apiKey);
  if (cfg.baseUrl) fd.append("baseUrl", cfg.baseUrl);
  if (cfg.model) fd.append("model", cfg.model);
  const r = await fetch(LIVE_ORIGIN + "/api/ocr", { method: "POST", body: fd });
  if (!r.ok) throw new Error("HTTP " + r.status);
  const j = await r.json();
  f.state = j.ok ? "ok" : "fail";
  f.rec = j;
  f.err = j.ok ? "" : (j.error || j.message || "识别失败");
  wRenderSide(); wRenderBody();
  const done = W.files.filter(x => x.state === "ok" || x.state === "fail").length;
  const eta = bEtaSec(done, n, t0);
  const p = $w("#wProgTx");
  if (p) p.textContent = done + " / " + n + (eta ? " · 预计剩余 " + bEtaText(eta) : "");
  const bar = $w("#wProg");
  if (bar) bar.style.width = Math.round(done / n * 100) + "%";
}

async function wRun(){
  if (W.running || !W.files.length) return;
  const online = await probeServer();
  if (!online) { wRenderBody(); toast("后端未启动，无法识别"); return; }
  W.running = true; W.abort = false;
  wRenderBody();
  const todo = W.files.filter(f => f.state !== "ok");
  const t0 = Date.now();
  const go = $w("#wGo"), stop = $w("#wStop");
  if (go) go.style.display = "none";
  if (stop) stop.style.display = "";
  if (stop) stop.onclick = () => { W.abort = true; W.running = false; wRenderBody(); };
  for (let k = 0; k < todo.length; k++) {
    if (W.abort) break;
    const f = todo[k];
    f.state = "run"; wRenderSide();
    try { await wRunOne(f, k, todo.length, t0); }
    catch (e) { f.state = "fail"; f.err = e.message || String(e); wRenderSide(); wRenderBody(); }
  }
  W.running = false;
  const okN = W.files.filter(f => f.state === "ok").length;
  const badN = W.files.filter(f => f.state === "fail").length;
  toast("完成：成功 " + okN + " / 失败 " + badN);
  wRenderBody();
}

/* ── 单张结果详情 ── */
function wFieldsTable(rec){
  const f = rec.fields || {};
  const keys = Object.keys(f);
  if (!keys.length) return '<div class="hint">没有抽到字段。</div>';
  return '<div class="dtwrap"><table class="dt fld"><thead><tr>' +
    '<th>字段</th><th>抽取结果</th><th>置信</th><th>证据</th></tr></thead><tbody>' +
    keys.map(k => {
      const v = f[k] || {};
      const val = v.value != null ? String(v.value) : "";
      const conf = v.conf != null ? v.conf : (v.score != null ? v.score : null);
      const ev = v.evidence || {};
      const crop = ev.crop ? '<img class="ev" src="' + ev.crop + '" alt="证据">' : '<span class="muted">—</span>';
      return '<tr><td class="k">' + esc(k) + '</td>' +
        '<td class="v">' + (val ? esc(val).replace(/\n/g, "<br>") : '<span class="muted">—</span>') + '</td>' +
        '<td>' + (conf != null ? Number(conf).toFixed(2) : "—") + '</td>' +
        '<td>' + crop + '</td></tr>';
    }).join("") + '</tbody></table></div>';
}

function wItemsTable(items){
  if (!items || !items.length) return '<div class="hint">没有明细行。</div>';

    '<th>#</th><th>说明</th><th>数量</th><th>单价</th><th>金额</th></tr></thead><tbody>' +
    items.map((it, i) => '<tr><td>' + (i + 1) + '</td><td>' + esc(it.description || "—") + '</td>' +

      '<td>' + esc(it.total_price || "—") + '</td></tr>').join("") +
    '</tbody></table></div>';
}

function wComplianceCards(rec){
  const c = rec.compliance;
  if (!c) return "";
  if (c.error) return '<div class="hint">合规链路出错：' + esc(c.error) + '</div>';
  const ap = c.applicability || {};
  const st = v => v === true ? wPill("ok", "适用")
    : v === false ? wPill("", "不适用") : wPill("warn", "待人工判定");
  const lo = c.legal_original || {}, sg = c.signature || {}, vf = c.verify || {};
  const card = (title, flag, rows) =>
    '<div class="ccard"><div class="h">' + esc(title) + ' ' + st(flag) + '</div>' +
    rows.map(r => '<div class="r"><span>' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>').join("") +
    '</div>';
  return '<div class="sec-h" style="margin-top:22px">合规链路<span class="pill" style="margin-left:8px">provider: ' +
    esc(c.provider || "—") + '</span></div>' +
    '<div class="cgrid">' +
    card("取法定原件", ap.xml, [
      ["是否取到", lo.available ? "是" : "否"],
      ["格式", lo.format || "—"],
      ["来源", lo.source || "—"],
      ["说明", lo.reason || "—"],
    ]) +
    card("XMLDSig 验签", ap.sign, [
      ["结论", sg.valid ? "有效" : (sg.applicable === false ? "不适用" : "无效")],
      ["算法", sg.algorithm || "—"],
      ["证书序列号", sg.cert_serial || "—"],
      ["签名方", sg.signer || "—"],
      ["说明", sg.reason || "—"],
    ]) +
    card("发票查验", ap.verify, [
      ["结论", vf.ok ? "正常" : (vf.applicable === false ? "不适用" : "异常")],
      ["状态码", vf.code || "—"],
      ["票据状态", vf.invoice_state || "—"],
      ["已查验次数", String(vf.times != null ? vf.times : "—")],
      ["渠道", vf.channel || "—"],
      ["说明", vf.message || "—"],
    ]) +
    '</div>';
}

function wDetail(f){
  const rec = f.rec || {};
  if (!rec.ok) {
    return '<div class="card"><div class="card-b"><div class="offline">' +
      '<div class="h">这张没能识别</div><div class="d">' + esc(f.err || rec.error || "未知原因") + '</div>' +
      (rec.stderr ? '<pre class="code">' + esc(rec.stderr.slice(-800)) + '</pre>' : '') +
      '</div></div></div>';
  }
  const v = rec.vtype || {};
  const meta = [
    ["票种", (v.name || "未知") + (v.code ? "（" + v.code + "）" : "")],
    ["置信", v.confidence != null ? Number(v.confidence).toFixed(2) : "—"],
    ["OCR 行数", String(rec.line_count || 0)],
    ["平均置信", rec.avg_conf != null ? Number(rec.avg_conf).toFixed(3) : "—"],
    ["耗时", (rec.elapsed != null ? rec.elapsed : "—") + "s"],
    ["策略", rec.extractor || W.ext],
  ];
  let h = '<div class="card"><div class="card-h"><span class="t">' + esc(f.name) + '</span>' +
    '<span class="h">' + wSize(f.size) + ' · ' + (rec.img_size ? rec.img_size.join("×") : "") + '</span></div>' +
    '<div class="card-b"><div class="wview"><div class="wleft">' +
    '<img class="wprev" src="' + f.url + '" alt="">' +
    '<div class="grid2">' + meta.map(m => '<div class="cell"><div class="k">' +
      esc(m[0]) + '</div><div class="v">' + esc(m[1]) + '</div></div>').join("") + '</div>' +
    (v.evidence && v.evidence.length ? '<div class="hint">判定依据：' +
      esc(v.evidence.join("、")) + '</div>' : '') +
    '</div><div class="wright">' +
    '<div class="sec-h">抽取字段</div>' + wFieldsTable(rec) +
    '<div class="sec-h" style="margin-top:20px">明细行（' + ((rec.items || []).length) + '）</div>' +
    wItemsTable(rec.items) +
    wComplianceCards(rec) +
    '</div></div></div></div>';
  const lines = rec.lines || [];
  if (lines.length) {
    h += '<div class="card"><div class="card-h"><span class="t">OCR 原文</span>' +
      '<span class="h">' + lines.length + ' 行 · 按版面顺序</span></div>' +
      '<div class="card-b"><div class="ocrlines">' +
      lines.map((l, i) => '<div class="ln"><i>' + (i + 1) + '</i><span>' + esc(l.text) +
        '</span><b>' + (l.conf != null ? Number(l.conf).toFixed(2) : "") + '</b></div>').join("") +
      '</div></div></div>';
  }
  return h;
}

function wRenderBody(){
  const body = $w("#wBody"); if (!body) return;
  const f = W.files.find(x => x.id === W.cur);
  let h = '<div class="wpane">';
  h += '<div class="bp-head"><div><div class="t">识别</div>' +
    '<div class="s">导入发票图片 → 抽取字段 → 核对证据 → 跑合规链路</div></div></div>';
  /* 后端不在就说清楚：这时候「导入」依旧可用，但「识别」跑不了，不能让人白等 */
  h += W.online ? "" : wOffline();
  h += wDropHtml();
  h += wFormHtml();
  if (W.files.length) {
    const done = W.files.filter(x => x.state === "ok" || x.state === "fail").length;
    h += '<div class="card"><div class="card-h"><span class="t">进度</span>' +
      '<span class="h" id="wProgTx">' + (W.running ? done + " / " + W.files.filter(x => x.state !== "ok").length : done + " / " + W.files.length + " 已处理") + '</span></div>' +
      '<div class="card-b"><div class="prog"><i id="wProg" style="width:' +
      Math.round(done / W.files.length * 100) + '%"></i></div></div></div>';
  }
  if (f) h += wDetail(f);
  h += "</div>";
  body.innerHTML = h;

  const drop = $w("#wDrop");
  const btn = $w("#wDropBtn");
  const pick = () => {
    const inp = document.createElement("input");
    inp.type = "file"; inp.multiple = true; inp.accept = ".jpg,.jpeg,.png,.webp,.bmp,.tif,.tiff";
    inp.onchange = () => { wAddFiles(Array.from(inp.files || [])); };
    inp.click();
  };
  if (btn) btn.onclick = pick;
  if (drop) {
    drop.onclick = pick;
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => {
      e.preventDefault(); drop.classList.remove("over");
      wAddFiles(Array.from((e.dataTransfer || {}).files || []));
    };
  }
  const pk = $w("#wPick"); if (pk) pk.onclick = pick;
  const ad = $w("#wAdd"); if (ad) ad.onclick = pick;
  const cl = $w("#wClear"); if (cl) cl.onclick = () => {
    W.files.forEach(x => x.url && URL.revokeObjectURL(x.url));
    W.files = []; W.cur = null; wRenderSide(); wRenderBody();
  };
  const ex = $w("#wExt");
  if (ex) { ex.value = W.ext; ex.onchange = () => { W.ext = ex.value; }; }
  const cp = $w("#wComp");
  if (cp) { cp.checked = W.comp; cp.onchange = () => { W.comp = cp.checked; }; }
  const go = $w("#wGo");
  if (go) {
    go.disabled = !W.files.length;
    go.onclick = wRun;
    if (!W.files.length) go.title = "先导入图片";
  }
  wRenderSide();
}

/* ══════════════ 合规页 ══════════════ */
async function cRender(){
  const body = $w("#cBody"); if (!body) return;
  const online = await probeServer();
  let h = '<div class="cpane"><div class="bp-head"><div><div class="t">合规核验</div>' +
    '<div class="s">法定原件 / XMLDSig 验签 / 发票查验 —— 按票种判断是否适用，不适用就不伪造结果</div></div></div>';
  if (!online) { h += wOffline() + "</div>"; body.innerHTML = h; return; }

  let cap = {};
  try {
    const r = await fetch(LIVE_ORIGIN + "/api/capabilities", { cache: "no-store" });
    cap = await r.json();
  } catch (e) { cap = {}; }

  h += '<div class="card"><div class="card-h"><span class="t">运行环境</span>' +
    '<span class="h">' + (cap.provider === "real" ? "税务真实链路" : "Mock（算法一致，仅信任源不同）") + '</span></div>' +
    '<div class="card-b"><div class="cgrid">' +
    '<div class="ccard"><div class="h">合规提供方</div>' +
    '<div class="r"><span>OCR_COMPLIANCE_PROVIDER</span><b>' + esc(cap.provider || "—") + '</b></div>' +
    '<div class="r"><span>验签</span><b>' + (cap.abilities && cap.abilities.compliance_sign ? "可用" : "不可用") + '</b></div>' +
    '<div class="r"><span>查验</span><b>' + (cap.abilities && cap.abilities.compliance_verify ? "可用" : "不可用") + '</b></div></div>' +
    '<div class="ccard"><div class="h">OCR 运行时</div>' +
    '<div class="r"><span>解释器</span><b class="mono" style="font-size:11px">' + esc((cap.python || "").split("\\").pop() || "—") + '</b></div>' +
    '<div class="r"><span>进程内推理</span><b>' + (cap.has_ocr ? "是（快）" : "否（每次 spawn，慢几秒）") + '</b></div>' +
    '<div class="r"><span>LLM 抽取</span><b>' + (cap.llm_ready ? "已配置 " + esc(cap.llm_model || "") : "未配置 Key") + '</b></div></div>' +
    '</div></div></div>';

  /* 独立验签 */
  h += '<div class="card"><div class="card-h"><span class="t">XMLDSig 验签</span>' +
    '<span class="h">粘一段带 ds:Signature 的 XML 进来，用当前 provider 的公钥验</span></div>' +
    '<div class="card-b"><textarea id="cXml" rows="7" placeholder="粘贴 XML 原文…"></textarea>' +
    '<div style="margin-top:10px;display:flex;gap:8px;align-items:center">' +
    '<button class="btn primary" id="cVBtn">验签</button>' +
    '<button class="btn" id="cVClr">清空</button><span class="spacer"></span>' +
    '<span class="lbl" id="cVStat"></span></div>' +
    '<div id="cVOut"></div></div></div>';

  /* 票种判定 */
  h += '<div class="card"><div class="card-h"><span class="t">票种判定</span>' +
    '<span class="h">只给 OCR 文本就能判票种，并推导该票种要不要做合规动作</span></div>' +
    '<div class="card-b"><textarea id="cTxt" rows="5" placeholder="粘贴 OCR 文本…"></textarea>' +
    '<div style="margin-top:10px;display:flex;gap:8px;align-items:center">' +
    '<button class="btn primary" id="cTBtn">判定</button>' +
    '<button class="btn" id="cTClr">清空</button><span class="spacer"></span>' +
    '<span class="lbl" id="cTStat"></span></div>' +
    '<div id="cTOut"></div></div></div>';

  /* 说明 */
  h += '<div class="card"><div class="card-h"><span class="t">口径</span></div><div class="card-b">' +
    '<div class="hint">票种决定「要不要做」：英文商业发票这类非国内税务票据，取 XML / 验签 / 查验' +
    '都会如实返回<b>不适用</b>，而不是伪造一份通过。Mock 与 Real 共用同一份 XMLDSig 实现' +
    '（C14N + RSA-SHA256 + 摘要比对），差别只在公钥来源。</div></div></div>';

  h += "</div>";
  body.innerHTML = h;

  const vb = $w("#cVBtn");
  if (vb) vb.onclick = async () => {
    const xml = ($w("#cXml") || {}).value || "";
    const st = $w("#cVStat"), out = $w("#cVOut");
    if (!xml.trim()) { st.textContent = "先粘 XML"; return; }
    st.textContent = "验签中…";
    try {
      const r = await fetch(LIVE_ORIGIN + "/api/verify_xml", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ xml: xml })
      });
      const j = await r.json();
      st.textContent = "";
      if (!j.ok) { out.innerHTML = '<div class="hint">失败：' + esc(j.message || "") + '</div>'; return; }
      const good = !!j.valid;
      out.innerHTML = '<div class="cgrid" style="margin-top:12px"><div class="ccard">' +
        '<div class="h">结论 ' + wPill(good ? "ok" : "bad", good ? "签名有效" : "签名无效") + '</div>' +
        [["算法", j.algorithm], ["证书序列号", j.cert_serial], ["签名方", j.signer],
         ["签名时间", j.sign_time], ["provider", j.provider], ["耗时", j.elapsed + "s"]]
          .map(x => '<div class="r"><span>' + esc(x[0]) + '</span><b>' + esc(x[1] || "—") + '</b></div>').join("") +
        '</div></div>' + (j.reason ? '<div class="hint">' + esc(j.reason) + '</div>' : '');
    } catch (e) { st.textContent = "请求失败"; }
  };
  const vc = $w("#cVClr");
  if (vc) vc.onclick = () => { $w("#cXml").value = ""; $w("#cVOut").innerHTML = ""; $w("#cVStat").textContent = ""; };

  const tb = $w("#cTBtn");
  if (tb) tb.onclick = async () => {
    const txt = ($w("#cTxt") || {}).value || "";
    const st = $w("#cTStat"), out = $w("#cTOut");
    if (!txt.trim()) { st.textContent = "先粘文本"; return; }
    st.textContent = "判定中…";
    try {
      const r = await fetch(LIVE_ORIGIN + "/api/vtype", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text: txt })
      });
      const j = await r.json();
      st.textContent = "";
      if (!j.ok) { out.innerHTML = '<div class="hint">失败：' + esc(j.message || "") + '</div>'; return; }
      const v = j.vtype || {};
      const req = v.requirements || {};
      out.innerHTML = '<div class="cgrid" style="margin-top:12px">' +
        '<div class="ccard"><div class="h">票种</div>' +
        [["代码", v.code], ["名称", v.name], ["简称", v.short], ["置信", v.confidence],
         ["地区", v.region]].map(x => '<div class="r"><span>' + esc(x[0]) +
          '</span><b>' + esc(x[1] != null ? String(x[1]) : "—") + '</b></div>').join("") + '</div>' +
        '<div class="ccard"><div class="h">合规要求</div>' +
        [["法定原件", req.legal_original], ["验签", String(req.signature_check)],
         ["查验", req.verify], ["需要 XML", String(req.need_xml)]]
          .map(x => '<div class="r"><span>' + esc(x[0]) + '</span><b>' + esc(x[1] != null ? String(x[1]) : "—") +
            '</b></div>').join("") + '</div></div>' +
        (v.evidence && v.evidence.length ? '<div class="hint">判定依据：' + esc(v.evidence.join("、")) + '</div>' : '');
    } catch (e) { st.textContent = "请求失败"; }
  };
  const tc = $w("#cTClr");
  if (tc) tc.onclick = () => { $w("#cTxt").value = ""; $w("#cTOut").innerHTML = ""; $w("#cTStat").textContent = ""; };
}

/* ══════════════ 四视图切换（覆盖 optblock 的两视图版本）═════════════ */
function switchView(v) {
  BState.view = v;
  document.querySelectorAll(".seg button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  const map = { doc: "shellDoc", batch: "shellBatch", work: "shellWork", comp: "shellComp" };
  Object.keys(map).forEach(k => {
    const el = document.getElementById(map[k]);
    if (el) el.classList.toggle("hidden", v !== k);
  });
  const q = document.querySelector(".topbar .search");
  if (q) q.classList.toggle("hide", v !== "doc");
  if (v === "batch") { bRenderSide(); bRenderBody(); }
  if (v === "work") wRenderBody();
  if (v === "comp") cRender();
}
document.querySelectorAll(".seg button").forEach(b => b.onclick = () => switchView(b.dataset.v));

/* 进来看一眼后端在不在，不在就把「识别」页的说明换成启动指引 */
(async function wBoot() {
  const on = await probeServer();
  W.online = on;
  const tag = $w("#wConn");
  if (tag) {
    tag.textContent = on ? "后端已连接" : "后端未启动";
    tag.className = "pill " + (on ? "ok" : "warn");
  }
  switchView("work");
})();

/*WORK_JS_END*/
</script>
